<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="html.css" rel="stylesheet">
    <title>Se connecter - Open Source Platform</title>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Se connecter</h1>
            <div class="auth-buttons">
                <button class="btn btn-back" onclick="window.location.href='index.html'">Retour</button>
            </div>
        </div>
    </header>
    <hr>
    
    <main class="auth-main">
        <div class="auth-container">
            <h2>Connexion</h2>
            <form class="auth-form" action="#" method="POST">
                <div class="form-group">
                    <label for="email">Email :</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn btn-submit">Se connecter</button>
            </form>
            
            <p class="auth-link">
                Pas encore de compte ? 
                <a href="register.html">Créer un compte</a>
            </p>
        </div>
    </main>
    
    <hr>
    <footer>
        <p class="p1">ayari hadir 1ére IAG</p>
    </footer>
</body>
</html>
