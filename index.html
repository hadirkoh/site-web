<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="html.css" rel="stylesheet">
    <title>Interface de Connexion</title>
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <div class="welcome-section">
            <h1 class="title">Bienvenue</h1>
            <p class="subtitle">Connectez-vous pour accéder à votre compte</p>
        </div>
        
        <div class="buttons-container">
            <button class="btn login-btn" onclick="handleLogin()">
                <span class="btn-text">Se Connecter</span>
                <div class="btn-icon">→</div>
            </button>
            
            <button class="btn signup-btn" onclick="handleSignup()">
                <span class="btn-text">S'inscrire</span>
                <div class="btn-icon">+</div>
            </button>
        </div>
        
        <div class="decorative-elements">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
    </div>

    <script>
        function handleLogin() {
            // Animation du bouton
            const btn = event.target.closest('.login-btn');
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
                alert('Redirection vers la page de connexion...');
            }, 150);
        }

        function handleSignup() {
            // Animation du bouton
            const btn = event.target.closest('.signup-btn');
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
                alert('Redirection vers la page d\'inscription...');
            }, 150);
        }

        // Animation des éléments décoratifs
        document.addEventListener('DOMContentLoaded', function() {
            const circles = document.querySelectorAll('.circle');
            circles.forEach((circle, index) => {
                setTimeout(() => {
                    circle.style.opacity = '0.1';
                }, index * 500);
            });
        });
    </script>
</body>
</html>
